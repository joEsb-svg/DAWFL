name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  JUCE_VERSION: "9.0.4"
  NDK_VERSION: "28.1.13356709"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java (8 per il toolchain JUCE, 17 per Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17

      # JUCE + Projucer compilato vengono messi in cache: dalla seconda build in poi si risparmiano minuti.
      - name: Cache JUCE e Projucer
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-projucer-v1

      - name: Scarica JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: Compila Projucer
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev libxcomposite-dev libxi-dev
          # Projucer serve solo da riga di comando: curl non serve.
          ci/run-logged.sh "Projucer" make -C JUCE/extras/Projucer/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)" \
            CPPFLAGS="-UJUCE_USE_CURL -DJUCE_USE_CURL=0"

      - name: Genera il progetto Android
        run: ci/run-logged.sh "Projucer resave" JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave DAWFL.jucer

      - name: Installa NDK e CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # Sempre la stessa chiave di firma: cosi' ogni nuovo APK si installa sopra il precedente.
      - name: Chiave di firma
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Builds/Android/**/*.gradle', 'Builds/Android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Compila APK
        working-directory: Builds/Android
        run: |
          chmod +x gradlew
          ../../ci/run-logged.sh "Gradle" ./gradlew assembleRelease_Release --no-daemon \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64"

      - name: Prepara APK
        id: apk
        run: |
          APK=$(find Builds/Android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Trovato: $APK"
          cp "$APK" DAWFL.apk

      - name: Carica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAWFL-apk
          path: DAWFL.apk

      # Pubblica l'APK sempre allo stesso link: .../releases/download/latest-build/DAWFL.apk
      # (solo se questo commit e' ancora l'ultimo di main: una build vecchia arrivata in ritardo non sovrascrive quella nuova)
      - name: Pubblica release "latest-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          BUILT=$(git rev-parse HEAD)
          if [ "$LATEST" != "$BUILT" ]; then
            echo "Questo commit ($BUILT) non e' piu' l'ultimo ($LATEST): non pubblico."
            exit 0
          fi
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build DAWFL.apk \
            --target "$BUILT" \
            --prerelease \
            --title "DAWFL - ultima build (${BUILT::7})" \
            --notes "APK compilato automaticamente dal commit ${BUILT::7}. Scarica DAWFL.apk e installalo sul telefono."
